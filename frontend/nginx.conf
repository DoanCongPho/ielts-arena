server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API. The browser only ever talks to this nginx, so no
    # request is ever cross-origin and the backend needs no CORS handling
    # at all — that middleware was deleted rather than configured.
    # "api" is the compose service name; :8080 its in-network port.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Test media served by the Go binary out of internal/assets (Writing
    # Task 1 charts, diagrams, audio). Note this namespace belongs to the
    # API — the SPA's own build output lives under /static/ instead, see
    # build.assetsDir in vite.config.js.
    location /assets/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Without a bucket, speaking recordings are PUT to
        # /assets/media/... on the API. nginx's 1 MB default would reject
        # a two-minute Safari (AAC) recording.
        client_max_body_size 25m;
    }

    # Content-hashed bundles: safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
