services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    # Not published to the host: the browser reaches the API through the
    # frontend's nginx at :8081/api, same origin. Expose 8080 here only if
    # you want to curl the API directly during development.
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # The only port you need. nginx serves the SPA and proxies /api and
    # /assets to the api service.
    ports:
      - "8081:80"
    depends_on:
      - api
volumes:
  mysql_data:
